[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vop"
version = "0.6.11"
description = "Provider-neutral visual observability foundation and local API"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0", "psutil==7.1.0", "python-fasthtml==0.14.13", "tzdata==2026.5"]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]
camera = ["opencv-python-headless==4.13.0.92"]
tapo = ["python-kasa==0.12.0"]

[project.scripts]
vop = "vop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
