[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vop"
version = "0.1.0"
description = "Phase 0 provider-neutral visual inference feasibility CLI"
requires-python = ">=3.11"
dependencies = ["Pillow==12.0.0", "psutil==7.1.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
vop = "vop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
