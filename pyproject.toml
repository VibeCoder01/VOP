[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vop"
version = "0.2.0"
description = "Provider-neutral visual observability foundation and local API"
requires-python = ">=3.11"
dependencies = ["Pillow==12.0.0", "psutil==7.1.0", "python-fasthtml==0.14.13"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
camera = ["opencv-python-headless==4.13.0.92"]

[project.scripts]
vop = "vop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
