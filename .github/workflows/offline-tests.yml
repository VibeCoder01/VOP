name: Foundation offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-offline.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m vop demo --image fixtures/scene.png --engine mock
      - run: python tools/phase1_smoke.py
      - run: python tools/phase2_smoke.py
      - run: python tools/phase3_smoke.py
      - run: python tools/phase4_smoke.py
      - run: python tools/restart_smoke.py
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: vop-release-${{ matrix.os }}
          path: dist/*.zip
